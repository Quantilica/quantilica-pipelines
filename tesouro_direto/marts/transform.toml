[[table]]
name        = "mv_investors_state_gender"
schema      = "tesouro_direto"
strategy    = "replace"
engine      = "duckdb"
sql         = "mv_investors_state_gender.sql"
description = "UF por gênero"
indexes = [
    { name = "idx_mv_isg_state", columns = ["state"] },
