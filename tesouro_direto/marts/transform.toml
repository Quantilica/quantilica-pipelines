[[table]]
name        = "mv_investors_state_marital"
schema      = "tesouro_direto"
strategy    = "replace"
engine      = "duckdb"
sql         = "mv_investors_state_marital.sql"
description = "UF por estado civil"
indexes = [
    { name = "idx_mv_ism_state", columns = ["state"] },
]

[[table]]
name        = "mv_operations_monthly"
schema      = "tesouro_direto"
strategy    = "replace"
engine      = "duckdb"
sql         = "mv_operations_monthly.sql"
description = "Operações por mês, tipo de operação e título"
indexes = [
    { name = "uq_mv_operations_monthly", columns = ["operation_month", "operation_type", "bond_type"], unique = true },
    { name = "idx_mv_operations_monthly_bond_type", columns = ["bond_type"] },
    { name = "idx_mv_operations_monthly_month", columns = ["operation_month"] },
    { name = "idx_mv_operations_monthly_type", columns = ["operation_type"] },
]

[[table]]
name        = "mv_dashboard_stats"
schema      = "tesouro_direto"
strategy    = "replace"
engine      = "postgres"
sql         = "mv_dashboard_stats.sql"
description = "Linha única com os totais do painel (microdados via mart_microdata_totais, o resto das tabelas do PostgreSQL)"
primary_key = ["pkey"]
