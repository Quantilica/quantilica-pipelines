name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar catálogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # quantilica-sql não está no PyPI, só no índice Quantilica (GitHub Pages),
      # que responde 503 intermitente (2026-11-15) a pacote que não hospeda. Com
      # --index + unsafe-best-match o uv consultava o índice para cada dependência
      # de terceiros. --find-links lê só a página do próprio quantilica-sql (que
      # existe, logo não dá 503) e o resto vem do PyPI.
      - name: Validar manifest, fetch.toml e transform.toml
        run: |
          uv run --python 3.12 \
            --with quantilica-sql \
            --find-links https://index.quantilica.com/simple/quantilica-sql/ \
            quantilica-sql validate . --strict

  zizmor:
    name: Audit de workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Audit workflows with zizmor
        run: uvx zizmor --no-online-audits --min-severity high .github/workflows
