name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validar catálogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Validar manifest, fetch.toml e transform.toml
        run: |
          uv run --python 3.12 \
            --with quantilica-sql \
            --index https://index.quantilica.com/simple/ \
            --index-strategy unsafe-best-match \
            quantilica-sql validate . --strict
