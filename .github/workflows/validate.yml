name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar catálogo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # quantilica-sql não está no PyPI, só no índice Quantilica (GitHub Pages),
      # que responde 503 intermitente (2026-11-15) a pacote que não hospeda. Com
      # --index + unsafe-best-match o uv consultava o índice para cada dependência
      # de terceiros. --find-links lê só a página do próprio quantilica-sql (que
      # existe, logo não dá 503) e o resto vem do PyPI.
      - name: Validar manifest, fetch.toml e transform.toml
        run: |
          uv run --python 3.12 \
            --with quantilica-sql \
            --find-links https://index.quantilica.com/simple/quantilica-sql/ \
            quantilica-sql validate . --strict

  testes:
    name: Testes (todos os de tests/, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dados
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # O registro público de fetchers: as declarações de publicacao/ são conferidas
      # contra ele (fonte existente, redistribuição, pasta do lake).
      - name: Registro público de fetchers
        env:
          REGISTRO: ${{ runner.temp }}/registry.json
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 30 -A "quantilica-pipelines-ci" -o "$REGISTRO" https://index.quantilica.com/registry.json; then
              exit 0
            fi
            echo "::warning::registry.json indisponível (tentativa $i/3); nova tentativa em 10s"
            sleep 10
          done
          exit 1

      # TODOS os arquivos de tests/ (a varredura de catálogo, os marts, os contratos e
      # resultados com o PostgreSQL, e as declarações de publicacao/ com o validador de
      # ferramentas/). Os testes de contrato e de resultado criam o esquema do SIDRA e do
      # BCB SGS pelo quantilica-sql e rodam as SQL do catálogo contra ele. Exigem a versão
      # em que o adaptador do BCB SGS cria e preenche series_metadata (0.4.1; o esquema
      # dimensional do SIDRA é da 0.4.0). CI=true (definido pelo Actions) faz a falta do
      # banco, do pacote ou do registro reprovar em vez de pular o teste. --find-links
      # como no passo de validação (ver o comentário lá). duckdb e sqlalchemy: as
      # consultas das declarações rodam em DuckDB e o criador das tabelas usa SQLAlchemy.
      - name: Testes do catálogo
        env:
          QUANTILICA_TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/dados
          QUANTILICA_REGISTRO: ${{ runner.temp }}/registry.json
        run: |
          set -o pipefail
          uv run --python 3.12 \
            --with "quantilica-sql>=0.4.1" \
            --find-links https://index.quantilica.com/simple/quantilica-sql/ \
            --with duckdb \
            --with sqlalchemy \
            --with pytest \
            pytest -q -rs -p no:cacheprovider tests 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      # Teste de publicação que pula é teste que não rodou: reprova (a CI tem tudo).
      - name: Nenhum teste de publicação pulou
        run: |
          if grep -E '^SKIPPED .*tests/test_(publicacao|declaracao)' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::teste de publicação pulado (motivo acima)"
            exit 1
          fi

  publicacao:
    name: Declarações de publicacao/ (validador e consultas em Parquet sintético)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Registro público de fetchers
        env:
          REGISTRO: ${{ runner.temp }}/registry.json
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 30 -A "quantilica-pipelines-ci" -o "$REGISTRO" https://index.quantilica.com/registry.json; then
              exit 0
            fi
            echo "::warning::registry.json indisponível (tentativa $i/3); nova tentativa em 10s"
            sleep 10
          done
          exit 1

      # Só biblioteca padrão no validador; duckdb roda as consultas sobre Parquet
      # sintético e sqlalchemy gera o DDL. Sem PostgreSQL nem quantilica-sql: este job
      # não depende do índice próprio nem de serviço, e valida cada conjunto.toml.
      - name: Validar cada conjunto.toml e rodar as consultas
        env:
          QUANTILICA_REGISTRO: ${{ runner.temp }}/registry.json
        run: |
          set -o pipefail
          python3 ferramentas/quantilica_publicacao/declaracao.py \
            --registro "$QUANTILICA_REGISTRO" publicacao
          python3 ferramentas/quantilica_publicacao/declaracao.py \
            publicacao/_exemplo/conjunto.toml
          uv run --python 3.12 \
            --with duckdb \
            --with sqlalchemy \
            --with pytest \
            pytest -q -rs -p no:cacheprovider \
              tests/test_publicacao.py tests/test_declaracao.py tests/test_publicacao_ddl.py \
              2>&1 | tee "$RUNNER_TEMP/pytest.log"
          if grep -E '^SKIPPED' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::teste de publicação pulado (motivo acima)"
            exit 1
          fi

  zizmor:
    name: Audit de workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false

      - name: Audit workflows with zizmor
        run: uvx zizmor --no-online-audits --min-severity high .github/workflows
