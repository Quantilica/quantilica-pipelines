name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar catálogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # quantilica-sql não está no PyPI, só no índice Quantilica (GitHub Pages),
      # que responde 503 intermitente (2026-11-15) a pacote que não hospeda. Com
      # --index + unsafe-best-match o uv consultava o índice para cada dependência
      # de terceiros. --find-links lê só a página do próprio quantilica-sql (que
      # existe, logo não dá 503) e o resto vem do PyPI.
      - name: Validar manifest, fetch.toml e transform.toml
        run: |
          uv run --python 3.12 \
            --with quantilica-sql \
            --find-links https://index.quantilica.com/simple/quantilica-sql/ \
            quantilica-sql validate . --strict

  testes:
    name: Testes (contrato e resultado, PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dados
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # Os testes de contrato e de resultado criam o esquema do SIDRA e do BCB SGS pelo
      # quantilica-sql e rodam as SQL do catálogo contra ele. Exigem a versão em que o
      # adaptador do BCB SGS cria e preenche series_metadata (0.4.1; o esquema
      # dimensional do SIDRA é da 0.4.0). CI=true (definido pelo Actions) faz a
      # falta do banco ou do pacote reprovar em vez de pular o teste. --find-links como
      # no passo de validação (ver o comentário lá).
      - name: Testes do catálogo
        env:
          QUANTILICA_TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/dados
        run: |
          uv run --python 3.12 \
            --with "quantilica-sql>=0.4.1" \
            --find-links https://index.quantilica.com/simple/quantilica-sql/ \
            --with pytest \
            pytest -q -rs \
              tests/test_catalogo_descoberta.py \
              tests/test_ibge_contrato.py \
              tests/test_ibge_resultado.py \
              tests/test_bcb_contrato.py \
              tests/test_bcb_resultado.py

  zizmor:
    name: Audit de workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false

      - name: Audit workflows with zizmor
        run: uvx zizmor --no-online-audits --min-severity high .github/workflows
