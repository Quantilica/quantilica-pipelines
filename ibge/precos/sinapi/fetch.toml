# --- Custo Médio m² ---

# Tabela 2296 - Custo médio m² em moeda corrente e variações percentuais
# no mês, no ano e em doze meses
# Notas: ver série histórica de moedas (Cz$/NCz$/CR$/R$); base junho/94 = 100;
# nova ponderação a partir de 2011 (PNAD 2009); efeitos de desoneração da folha
# em maio/junho/julho de 2013.
[[tabelas]]
