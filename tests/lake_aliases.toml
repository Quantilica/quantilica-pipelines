# Views do lake (`<fonte>.<alias>`) que os pipelines DuckDB podem referenciar.
#
# O nome da view vem de quantilica_sql/lake/duck.py: é o `alias` do `_dataset.json`
# (gravado pelo conversor `lake.py` de cada fetcher) ou, sem descritor, o nome do
# diretório do dataset. A fonte é normalizada (`rfb-cnpj` -> `rfb_cnpj`).
#
# Este arquivo é versionado de propósito: o repositório não depende dos fetchers.
# Ao criar um mart sobre fonte/dataset novo, confirme o alias no `lake.py` do fetcher
# (ou no `_dataset.json` do lake) e acrescente aqui. `literal_aliases` são os aliases
# que aparecem escritos no `lake_py`; tests/test_marts.py confere isso quando o fetcher
# existe ao lado deste repositório (workspace Quantilica) e ignora a checagem fora dele.

[sources.b3]
lake_py = "b3-fetcher/src/b3_fetcher/lake.py"
# DATASET_SPECS: o COTAHIST (dataset cotacaohistorica) é a view `cotahist`.
aliases = ["cotahist", "btc_posicoes_abertas", "derivativos_agro", "indices_carteiras"]
literal_aliases = ["cotahist", "btc_posicoes_abertas", "derivativos_agro", "indices_carteiras"]

[sources.cvm]
lake_py = "cvm-fetcher/src/cvm_fetcher/lake.py"
# alias = DATASET_ALIASES.get(grupo, grupo com "-" trocado por "_").
