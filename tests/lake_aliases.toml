    "adm_cart_cad", "agente_auton_cad", "agente_fiduc_cad", "auditor_cad", "cia_cad",
    "cia_cgvn", "cia_dfp", "cia_fca", "cia_fre", "cia_ipe", "cia_itr", "consultor_cad",
    "fi_balancete", "fi_cad", "fi_cda", "fi_entrega", "fi_extrato", "fi_inf_diario",
    "fi_lamina", "fi_perfil", "fiagro_inf_mensal", "fii_dfin", "fii_inf_anual",
    "fii_inf_mensal", "fii_inf_trim", "inf_mensal_fidc", "inf_quadrimestral_fip",
    "intermed_cad", "ofertas_distribuicao", "securitizacao_cra", "securitizacao_cri",
]
literal_aliases = [
    "inf_mensal_fidc", "inf_quadrimestral_fip", "ofertas_distribuicao",
    "securitizacao_cra", "securitizacao_cri",
