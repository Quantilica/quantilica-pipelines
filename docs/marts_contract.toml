# Contrato de colunas dos marts (tabelas `marts.*` no PostgreSQL do portal).
# Fonte única para tests/test_marts_duckdb.py e para docs/marts.md.
# `status = "active"`: está no manifest.toml e roda em `quantilica sql run marts`.
# `status = "disabled"`: SQL mantido, fora do manifest até a dependência upstream.
# Tipos são os do DuckDB na saída da consulta; o mapeamento para PostgreSQL é o de
# quantilica_sql.lake.duck.pg_type (BIGINT->bigint, INTEGER->integer, DOUBLE->double
# precision, VARCHAR->text, DATE->date, DECIMAL(p,s)->numeric(p,s), BOOLEAN->boolean).

[[mart]]
table  = "marts.macro_series"
status = "active"
path   = "marts"
sql    = "macro_series.sql"
key    = ["data"]
columns = [
    { name = "data", type = "DATE" },
    { name = "taxa_selic_media", type = "DOUBLE" },
    { name = "taxa_ipca_media", type = "DOUBLE" },
    { name = "taxa_prefixado_media", type = "DOUBLE" },
]

