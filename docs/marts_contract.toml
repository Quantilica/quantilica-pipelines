table  = "marts.comex_fluxos"
status = "active"
path   = "marts"
sql    = "comex_fluxos.sql"
key    = ["ano", "mes", "uf", "tipo_operacao"]
columns = [
    { name = "ano", type = "INTEGER" },
    { name = "mes", type = "INTEGER" },
    { name = "uf", type = "VARCHAR" },
    { name = "tipo_operacao", type = "VARCHAR" },
